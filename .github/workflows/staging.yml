# ============================================================
# KESSIA — Déploiement staging + smoke tests (cahier des charges §50)
#
# Squelette prêt à activer. Nécessite, côté secrets GitHub :
#   STAGING_DEPLOY_HOOK   URL de déclenchement du déploiement (Vercel/…)
#   STAGING_BASE_URL      URL publique de l'environnement staging
#   STAGING_SMOKE_PHONE / STAGING_SMOKE_PASSWORD   compte de test
#
# Tant que ces secrets ne sont pas définis, les étapes sont ignorées
# proprement (pas d'échec de pipeline).
# ============================================================
name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger deploy
        if: env.STAGING_DEPLOY_HOOK != ''
        run: curl -fsSL -X POST "$STAGING_DEPLOY_HOOK"

      - name: Wait for deploy
        if: env.STAGING_BASE_URL != ''
        run: sleep 90

      - uses: actions/setup-node@v4
        if: env.STAGING_BASE_URL != ''
        with:
          node-version: 20

      - name: Smoke tests
        if: env.STAGING_BASE_URL != ''
        working-directory: kessia-app
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SMOKE_PHONE: ${{ secrets.STAGING_SMOKE_PHONE }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: node scripts/smoke.mjs

      - name: Skipped notice
        if: env.STAGING_BASE_URL == ''
        run: echo "Secrets staging non configurés — étape ignorée. Voir docs/operations/backup-recovery.md et .github/workflows/staging.yml."
