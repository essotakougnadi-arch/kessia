# ============================================================
# KESSIA — Tests E2E (cahier des charges §49)
#   Postgres éphémère → migrate + seed → build → Playwright
# La base est jetable : recréée à chaque exécution, jamais la prod.
# ============================================================
name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kessia
          POSTGRES_PASSWORD: kessia
          POSTGRES_DB: kessia_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kessia"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://kessia:kessia@localhost:5432/kessia_e2e
      JWT_SECRET: e2e-jwt-secret
      JWT_REFRESH_SECRET: e2e-refresh-secret
      SMS_PROVIDER: DEV
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PORT: "3000"
      # Contournement du rate-limit pour la suite E2E (ignoré en production)
      E2E_RATE_LIMIT_BYPASS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kessia-app/package-lock.json

      - name: Install
        working-directory: kessia-app
        run: npm ci

      - name: Prisma generate + push schema
        working-directory: kessia-app
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Seed
        working-directory: kessia-app
        run: npm run db:seed

      - name: Install Playwright browser
        working-directory: kessia-app
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: kessia-app
        run: npm run build

      - name: E2E
        working-directory: kessia-app
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: kessia-app/playwright-report
          retention-days: 7
