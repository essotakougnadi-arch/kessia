# ============================================================
# KESSIA — Tests d'intégration (cahier des charges §49)
#   Postgres éphémère → generate + migrate deploy + seed → vitest (*.itest.ts)
# Exercent les handlers de route et les services de domaine contre
# une vraie base (ledger atomique, idempotence, webhooks, plafonds
# KYC, cycle de tontine). Base jetable, jamais la prod.
#
# `prisma migrate deploy` (et non `db push`, ADR 0048) : applique
# l'historique versionné de prisma/migrations/ sur une base neuve —
# valide à chaque run que la baseline s'applique proprement.
# ============================================================
name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kessia
          POSTGRES_PASSWORD: kessia
          POSTGRES_DB: kessia_itest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kessia"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://kessia:kessia@localhost:5432/kessia_itest
      JWT_SECRET: itest-jwt-secret
      JWT_REFRESH_SECRET: itest-refresh-secret
      SMS_PROVIDER: DEV
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kessia-app/package-lock.json

      - name: Install
        working-directory: kessia-app
        run: npm ci

      - name: Garde anti-production — DATABASE_URL ne doit jamais être une base réelle
        run: |
          if echo "$DATABASE_URL" | grep -qiE "supabase\.co|pooler\.supabase\.com"; then
            echo "::error::DATABASE_URL pointe vers un hôte Supabase — refus d'exécuter une migration CI dessus."
            exit 1
          fi
          echo "OK — DATABASE_URL cible le Postgres éphémère du runner (localhost), pas une base réelle."

      - name: Prisma generate
        working-directory: kessia-app
        run: npx prisma generate

      - name: Prisma migrate deploy (base éphémère du runner, jamais la prod)
        working-directory: kessia-app
        # Aucune option de contournement (continue-on-error / || true) : un
        # échec de migration ici fait échouer le job immédiatement (ADR 0048).
        run: npx prisma migrate deploy

      - name: Vérifier l'état des migrations
        working-directory: kessia-app
        run: npx prisma migrate status

      - name: Seed (jeu de données représentatif)
        working-directory: kessia-app
        run: npm run db:seed

      - name: Tests dépendant de la base (Ledger, Wallet, Tontines, Marketplace, AuditLog…)
        working-directory: kessia-app
        run: npm run test:integration
