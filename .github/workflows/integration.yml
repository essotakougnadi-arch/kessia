# ============================================================
# KESSIA — Tests d'intégration (cahier des charges §49)
#   Postgres éphémère → generate + push + seed → vitest (*.itest.ts)
# Exercent les handlers de route et les services de domaine contre
# une vraie base (ledger atomique, idempotence, webhooks, plafonds
# KYC, cycle de tontine). Base jetable, jamais la prod.
# ============================================================
name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kessia
          POSTGRES_PASSWORD: kessia
          POSTGRES_DB: kessia_itest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kessia"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://kessia:kessia@localhost:5432/kessia_itest
      JWT_SECRET: itest-jwt-secret
      JWT_REFRESH_SECRET: itest-refresh-secret
      SMS_PROVIDER: DEV
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kessia-app/package-lock.json

      - name: Install
        working-directory: kessia-app
        run: npm ci

      - name: Prisma generate + push schema
        working-directory: kessia-app
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Seed
        working-directory: kessia-app
        run: npm run db:seed

      - name: Integration tests
        working-directory: kessia-app
        run: npm run test:integration
